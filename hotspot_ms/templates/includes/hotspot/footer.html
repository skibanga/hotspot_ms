<footer class="w-full py-8 px-6 border-t border-slate-200 bg-white mt-auto">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    <p class="text-slate-500 text-sm">© {{ current_year or 2026 }} {{ portal_brand or "Hapa Kitonga WiFi" }}. {{ _("All rights reserved.") }}</p>
    <div class="flex flex-col md:flex-row items-center gap-3 md:gap-6">
      {% if customer_support_tel %}
        <a class="text-slate-500 hover:text-primary text-sm font-semibold transition-colors" href="tel:{{ customer_support_tel | e }}">
          {{ _("Support") }}: <span class="font-black text-slate-700">{{ customer_support_number | e }}</span>
        </a>
      {% else %}
        <a class="text-slate-400 hover:text-primary text-sm font-medium transition-colors" href="#">{{ _("Contact Support") }}</a>
      {% endif %}
    </div>
  </div>
</footer>
