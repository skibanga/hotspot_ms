<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Ended</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: linear-gradient(150deg, #111827, #1f2937 60%, #0f172a);
      color: #111827;
    }
    .box {
      width: min(640px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .24);
      padding: 1.15rem;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .30);
    }
    h1 { margin: 0 0 .6rem; font-size: 1.25rem; }
    p { margin: 0 0 .6rem; color: #4b5563; }
    a {
      display: inline-block;
      text-decoration: none;
      background: #0ea5e9;
      color: #fff;
      padding: .65rem .9rem;
      border-radius: 10px;
      font-weight: 600;
      margin-top: .45rem;
    }
  </style>
</head>
<body>
  <section class="box">
    <h1>Session Ended</h1>
    <p>Your internet session ended or there is no active session linked to this device.</p>
    <p>Use a new voucher to reconnect.</p>
    <a href="/hotspot/login">Go to Hotspot Login</a>
  </section>
</body>
</html>
