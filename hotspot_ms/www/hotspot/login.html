{% extends "templates/web.html" %}

{% block page_content %}
<div class="hotspot-wrap">
  <div class="hotspot-grid">
    <section class="panel panel-plans">
      <h2>Buy Package</h2>
      <p class="muted">Select a package. Online payment integration will be enabled next.</p>
      <div id="package-list" class="package-list"></div>
    </section>

    <section class="panel panel-voucher">
      <h2>I Have a Voucher</h2>
      <p class="muted">Enter your voucher code to validate and connect.</p>
      <label for="voucher-code">Voucher Code</label>
      <input id="voucher-code" type="text" placeholder="e.g. BATCH01-AB12CD34" autocomplete="off" />
      <div class="button-row">
        <button id="btn-verify" class="btn btn-default">Validate</button>
        <button id="btn-connect" class="btn btn-primary">Connect</button>
      </div>
      <div id="voucher-response" class="response"></div>
    </section>
  </div>
</div>

<style>
.hotspot-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
.hotspot-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem; }
.panel { border: 1px solid #e2e2e2; border-radius: 8px; padding: 1rem; background: #fff; }
.panel h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
.muted { color: #666; margin-bottom: 1rem; }
.package-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .75rem; }
.package-card { border: 1px solid #e8e8e8; border-radius: 8px; padding: 0.75rem; background: #fafafa; }
.package-card h4 { margin: 0 0 .4rem; font-size: 1rem; }
.package-price { font-weight: 700; margin: 0 0 .2rem; }
.package-meta { color: #555; font-size: .9rem; }
label { display: block; font-weight: 600; margin-bottom: .35rem; }
input[type="text"] { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: .55rem .65rem; margin-bottom: .75rem; }
.button-row { display: flex; gap: .5rem; margin-bottom: .75rem; }
.response { min-height: 1.4rem; font-size: .95rem; }
.response.ok { color: #1e8e3e; }
.response.err { color: #c62828; }
@media (max-width: 900px) { .hotspot-grid { grid-template-columns: 1fr; } }
</style>

<script>
(function () {
  const packageList = document.getElementById("package-list");
  const voucherInput = document.getElementById("voucher-code");
  const response = document.getElementById("voucher-response");
  const btnVerify = document.getElementById("btn-verify");
  const btnConnect = document.getElementById("btn-connect");

  function setResponse(ok, text) {
    response.className = "response " + (ok ? "ok" : "err");
    response.textContent = text || "";
  }

  async function callApi(method, params) {
    const query = new URLSearchParams(params || {}).toString();
    const url = `/api/method/${method}` + (query ? `?${query}` : "");
    const res = await fetch(url, { credentials: "same-origin" });
    const data = await res.json();
    return data.message || {};
  }

  async function loadPackages() {
    try {
      const result = await callApi("hotspot_ms.api.portal.get_packages");
      const items = result.packages || [];
      if (!items.length) {
        packageList.innerHTML = '<div class="muted">No packages available.</div>';
        return;
      }
      packageList.innerHTML = items.map((p) => {
        const currency = p.currency || "TZS";
        const dataText = p.data_limit_mb ? `${p.data_limit_mb} MB` : "Unlimited data";
        return `
          <article class="package-card">
            <h4>${p.plan_name}</h4>
            <p class="package-price">${currency} ${p.price}</p>
            <p class="package-meta">${p.validity_value} ${p.validity_unit} | ${dataText}</p>
            <button class="btn btn-sm" disabled title="Payment integration coming soon">Buy Soon</button>
          </article>
        `;
      }).join("");
    } catch (err) {
      packageList.innerHTML = '<div class="response err">Failed to load packages.</div>';
    }
  }

  async function verifyVoucher() {
    const code = (voucherInput.value || "").trim();
    if (!code) {
      setResponse(false, "Enter voucher code first.");
      return null;
    }
    const result = await callApi("hotspot_ms.api.portal.verify_voucher", { voucher_code: code });
    if (!result.ok) {
      setResponse(false, result.message || "Voucher invalid.");
      return null;
    }
    const voucher = result.voucher || {};
    const expiry = voucher.expires_on ? ` | Expires: ${voucher.expires_on}` : "";
    setResponse(true, `Valid voucher for plan ${voucher.plan}${expiry}`);
    return result;
  }

  btnVerify.addEventListener("click", async function () {
    try {
      await verifyVoucher();
    } catch (e) {
      setResponse(false, "Validation failed. Try again.");
    }
  });

  btnConnect.addEventListener("click", async function () {
    try {
      const verified = await verifyVoucher();
      if (!verified) return;
      const code = (voucherInput.value || "").trim();
      const activated = await callApi("hotspot_ms.api.portal.activate_voucher", { voucher_code: code });
      if (!activated.ok) {
        setResponse(false, activated.message || "Could not activate voucher.");
        return;
      }
      const sid = encodeURIComponent(activated.session_id || "");
      const vc = encodeURIComponent(code);
      window.location.href = `/hotspot/status?session_id=${sid}&voucher_code=${vc}`;
    } catch (e) {
      setResponse(false, "Connection request failed.");
    }
  });

  loadPackages();
})();
</script>
{% endblock %}
