<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting...</p>
  <script>
    (function () {
      const search = window.location.search || "";
      const q = new URLSearchParams(search);
      const isCaptive = ["tok", "clientip", "clientmac", "authaction", "fas", "redir", "hid", "gatewayname"]
        .some((k) => (q.get(k) || "").trim() !== "");

      const target = isCaptive
        ? `/hotspot/login${search}`
        : `/login${search}`;

      window.location.replace(target);
    })();
  </script>
  <noscript>
    <p><a href="/hotspot/login">Continue to hotspot login</a></p>
    <p><a href="/login">Continue to desk login</a></p>
  </noscript>
</body>
</html>
